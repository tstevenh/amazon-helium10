[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; Overridden at runtime by app/config.py's DATABASE_URL inside alembic/env.py.
; This value only matters if alembic is ever invoked without env.py reading settings.
sqlalchemy.url = postgresql+psycopg2://user:pass@localhost:5432/ppc_os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
