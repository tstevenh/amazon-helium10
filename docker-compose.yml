services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ppc_net

  redis:
    image: redis:7-alpine
    # Broker only — no persistence needed; jobs live in Postgres.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ppc_net

  worker:
    build:
      context: ./backend
    # Clear the image ENTRYPOINT — that script runs migrations and seeds
    # users, which only the api container should do.
    entrypoint: []
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
      # Long-running operational scripts belong here rather than in api:
      # restarting api to pick up a code change kills anything running inside
      # it, and a placement report takes 20-40 minutes to generate.
      - ./scripts:/app/scripts
      - ./backend/alembic:/app/alembic
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - ppc_net

  beat:
    build:
      context: ./backend
    entrypoint: []
    # Beat only schedules; it never executes tasks. Keeping it separate from
    # the worker means restarting a worker cannot drop the schedule.
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    volumes:
      - ./backend/app:/app/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ppc_net

  api:
    build:
      context: ./backend
    volumes:
      - ./backend/app:/app/app
      # Mounted so test edits are picked up without rebuilding the image.
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
      # Mounted so new migrations are visible without rebuilding the image.
      - ./backend/alembic:/app/alembic
      # One-off operational scripts, run via docker compose exec.
      - ./scripts:/app/scripts
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Loopback only — a reverse proxy terminates TLS in front of this.
      - "127.0.0.1:8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - ppc_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    environment:
      # NEXT_PUBLIC_API_URL is baked into the browser bundle at build/dev time.
      # /backend is a same-origin path that the Next.js proxy rewrites to the backend.
      # This avoids all CORS issues regardless of browser (Brave, Chrome, etc.).
      NEXT_PUBLIC_API_URL: /backend
      # API_URL is the server-side destination for the Next.js rewrite proxy.
      # Inside Docker this must use the service name, not localhost.
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    ports:
      # Loopback only — a reverse proxy terminates TLS in front of this.
      - "127.0.0.1:3000:3000"
    networks:
      - ppc_net

volumes:
  postgres_data:

networks:
  ppc_net:
    driver: bridge
