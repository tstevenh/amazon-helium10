services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ppc_net

  api:
    build:
      context: ./backend
    volumes:
      - ./backend/app:/app/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - ppc_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    environment:
      # NEXT_PUBLIC_API_URL is baked into the browser bundle at build/dev time.
      # /backend is a same-origin path that the Next.js proxy rewrites to the backend.
      # This avoids all CORS issues regardless of browser (Brave, Chrome, etc.).
      NEXT_PUBLIC_API_URL: /backend
      # API_URL is the server-side destination for the Next.js rewrite proxy.
      # Inside Docker this must use the service name, not localhost.
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - ppc_net

volumes:
  postgres_data:

networks:
  ppc_net:
    driver: bridge
